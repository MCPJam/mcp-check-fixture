# Declared configuration for MCPJam PR checks.
#
# This file is AUTHORITATIVE: when it is present the checker uses exactly what
# it says and never falls back to guessing. If it is invalid, the check fails
# as `recipe_invalid` rather than quietly detecting something else — a broken
# declaration is a bug in this file, not a repo the checker could not resolve.
version: 1
checks:
  transport: streamable-http
  build: npm ci && npm run build
  start: npm start
  # The port the server listens on inside the sandbox. The bind address is not
  # load-bearing (the sandbox bridge reaches loopback too, verified e2e); the
  # PORT matching this value is.
  port: 3001
  path: /mcp

